<html lang="en">
	<head>

		<link rel="icon" href="/favicon.ico" sizes="any" />
		<meta name="theme-color" content="#fbfbf9" />

		<title>Ashmith Maddala</title>
		<meta
			name="description"

		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://ashmithmaddala.com/" />
		<meta property="og:title" content="Ashmith Maddala" />
		<meta
			property="og:description"
			content="Junior product security engineer at Vontier, in Bengaluru. I build security tooling."
		/>
		<!--
			TODO: add a 1200x630 card at public/og.jpg, then re-add og:image
			and switch twitter:card to summary_large_image. Pointing at a
			missing file renders a broken preview, so the tags stay out.
		-->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:creator" content="@axmxtxh" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Ashmith Maddala",
				"url": "https://ashmithmaddala.com",
				"jobTitle": "Junior Product Security Engineer",
				"worksFor": { "@type": "Organization", "name": "Vontier" },
				"address": {
					"@type": "PostalAddress",
					"addressLocality": "Bengaluru",
					"addressCountry": "IN"
				},
				"alumniOf": {
					"@type": "CollegeOrUniversity",
					"name": "New Horizon College of Engineering"
				},
				"hasCredential": [
					{
						"@type": "EducationalOccupationalCredential",
						"name": "eJPT",
						"credentialCategory": "certificate"
					}
				],
				"sameAs": [
					"https://github.com/ashmithhmaddala",
					"https://www.linkedin.com/in/ashmith-maddala/",
					"https://x.com/axmxtxh"
				]
			}
		</script>

		<!-- Resolve the theme before first paint so there is no flash. -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem("theme");
					document.documentElement.dataset.theme =
						stored ||
						(window.matchMedia("(prefers-color-scheme: dark)")
							.matches
							? "dark"
							: "light");
				} catch (e) {
					document.documentElement.dataset.theme = "light";
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
